name: CI (Build & Test)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (.NET 11.0)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore Mnshor.sln

      - name: Build solution
        run: dotnet build Mnshor.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test Mnshor.sln -c Release --no-build --verbosity normal
